buildscript {
    dependencies {
        classpath group: 'org.hsqldb',
                  name: 'hsqldb',
                  version: '2.7.2'

        classpath group: 'org.flywaydb',
                name: 'flyway-database-hsqldb',
                version: '10.0.0'
    }
}

plugins {
    id 'java'
    id "org.flywaydb.flyway" version "10.0.0"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
}


repositories {
    mavenCentral()
}

def springVersion = '6.0.13'
def flywayVersion = '10.0.0'
def lombokVersion = '1.18.30'
def hibernateVersion = '6.2.13.Final'
def log4jVersion = '2.21.1'

dependencies {

    implementation group: 'org.hsqldb',
            name: 'hsqldb',
            version: '2.7.2'

    implementation group: 'org.springframework',
            name: 'spring-context',
            version: springVersion

    implementation group: 'org.springframework',
            name: 'spring-jdbc',
            version: springVersion

    compileOnly group: 'org.flywaydb',
            name: 'flyway-core',
            version: flywayVersion

    compileOnly group: 'org.projectlombok',
            name: 'lombok',
            version: lombokVersion

    annotationProcessor group: 'org.projectlombok',
            name: 'lombok',
            version: lombokVersion

    // for hibernate @Audit demo only

    implementation group: 'org.hibernate',
            name: 'hibernate-core',
            version: hibernateVersion

    implementation group: 'org.hibernate',
            name: 'hibernate-envers',
            version: hibernateVersion

    implementation group: 'org.springframework',
            name: 'spring-orm',
            version: springVersion

    implementation group: 'org.apache.logging.log4j',
            name: 'log4j-api',
            version: log4jVersion

    implementation group: 'org.apache.logging.log4j',
            name: 'log4j-core',
            version: log4jVersion

    testImplementation group: 'org.junit.jupiter',
            name: 'junit-jupiter-api',
            version: '5.10.0'

    testImplementation group: 'org.hamcrest',
            name: 'hamcrest',
            version: '2.2'

    testRuntimeOnly group: 'org.junit.jupiter',
            name: 'junit-jupiter-engine',
            version: '5.10.0'
}

flyway {
    def props = new Properties()

    file("src/main/resources/application.properties")
            .withInputStream { props.load(it) }

    url = props.getProperty("db.url")
    user = props.getProperty("db.user")
    password = props.getProperty("db.pass")

    locations = ['classpath:flyway']
}
